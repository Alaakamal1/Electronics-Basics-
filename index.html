function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);P=Array.from({length:Math.min(90,Math.round(W*H/20000))},()=>({x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.28,s:.2+Math.random()*.3,w:Math.random()*6.28}))}
function draw(){const rgb=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim()||'90,150,230';cx.clearRect(0,0,W,H);
for(const p of P){if(!reduce){p.w+=.02;p.a+=Math.sin(p.w)*.03;p.x+=Math.cos(p.a)*p.s;p.y+=Math.sin(p.a)*p.s;if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10}}
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=Math.hypot(dx,dy);if(d<110){cx.strokeStyle=`rgba(${rgb},${.16*(1-d/110)})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}
for(const p of P){cx.fillStyle=`rgba(${rgb},.5)`;cx.beginPath();cx.arc(p.x,p.y,2.4,0,6.28);cx.fill();cx.fillStyle=`rgba(${rgb},.12)`;cx.beginPath();cx.arc(p.x,p.y,6,0,6.28);cx.fill()}
if(!reduce)requestAnimationFrame(draw)}
size();draw();addEventListener('resize',()=>{size();if(reduce)draw()});
/* ui */
function stats(){$('sSeen').textContent=seen.size;$('sOk').textContent=[...res.values()].filter(r=>r.first==='ok').length;$('sBad').textContent=[...res.values()].filter(r=>r.first==='bad').length;$('sAll').textContent=total;document.querySelectorAll('.chip em').forEach((e,i)=>{const gr=D[t].groups[i];e.textContent=gr.items.filter(x=>seen.has(x.n)).length+'/'+gr.items.length})}
function head(n,text,c){const q=el('div','q');const b=el('div','n',n);b.style.setProperty('--c',c);q.append(b,el('div',null,text));return q}
function toggler(host,n,build,on){let a=null,open=false;const set=v=>{if(v===open)return;open=v;if(v){a=el('div','ans');a.append(build());host.append(a);seen.add(n)}else a.remove();if(on)on(v);stats();if(host._hint)host._hint.textContent=v?'Tap to hide the answer':(host._hint0||'Tap to show the answer')};host.tabIndex=0;host.setAttribute('role','button');
host.onclick=e=>{e.stopPropagation();set(!open)};host.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();set(!open)}};sets.push(set)}
function make(it,c,body,build,on){const k=el('div','card');k.style.setProperty('--c',c);k.append(head(it.n,it.q,c));if(body)k.append(body);const h=el('div','hint','Tap to show the answer');k.append(h);k._hint=h;toggler(k,it.n,build,on);return k}
const PRAISE=['Bravo! 🎉','Excellent! 👏','Great job! 🌟','Well done! ⭐','Perfect! 🎊'];
function burst(x,y){if(reduce)return;const cols=['#ff7aa8','#ffd23f','#4cc58a','#5aa0ff','#b48cff'];
for(let n=0;n<28;n++){const p=el('i','conf');const a=Math.random()*6.28,d=60+Math.random()*110;
p.style.cssText=`left:${x}px;top:${y}px;background:${cols[n%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--r:${Math.random()*720-360}deg`;
document.body.append(p);setTimeout(()=>p.remove(),1100)}}
function pick(it,btns,idx,right,fbHost,rightIdx,lab,ev){const r=res.get(it.n)||{first:null,done:false,lab};res.set(it.n,r);
if(r.done)return;r.lab=lab;r.done=true;r.first=right?'ok':'bad';r.idx=idx;
btns.forEach(b=>b.classList.add('lock'));
if(!right)btns[idx].classList.add('bad');
btns[rightIdx].classList.add('ok');
showFb(fbHost,r);
if(right){const b=btns[idx].getBoundingClientRect();burst(ev&&ev.clientX?ev.clientX:b.left+b.width/2,ev&&ev.clientY?ev.clientY:b.top+b.height/2)}
stats()}
function showFb(host,r){let f=host.querySelector('.fb');if(!f){f=el('div','fb');host.append(f)}
if(r.first==='ok'){f.className='fb ok';f.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)]+' Correct answer.'}
else{f.className='fb bad';f.textContent='✘ Wrong. The correct answer is: '+r.lab}}
function wire(it,btns,k,rightIdx,lab){const r=res.get(it.n);
btns.forEach((b,i)=>{b.tabIndex=0;b.setAttribute('role','button');
const go=e=>{e.stopPropagation();pick(it,btns,i,i===rightIdx,k,rightIdx,lab,e)};
b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go({})}}});
if(r&&r.done){btns.forEach(b=>b.classList.add('lock'));if(r.first==='bad')btns[r.idx].classList.add('bad');btns[rightIdx].classList.add('ok');showFb(k,r)}}
function mcq(it,c){const L='ABCD',o=el('div','opts');it.opts.forEach((tx,i)=>{const d=el('div','opt');d.append(el('b',null,L[i]),el('span',null,tx));o.append(d)});const r=L.indexOf(it.a);
const k=make(it,c,o,()=>el('span',null,'✔ Answer: '+it.a+') '+it.opts[r]),v=>o.children[r].classList.toggle('ok',v||!!(res.get(it.n)||{}).done));
k._hint.textContent='Tap an answer to check it · tap elsewhere to show the answer';k._hint0='Tap an answer to check it · tap elsewhere to show the answer';
wire(it,[...o.children],k,r,it.a+') '+it.opts[r]);return k}
function tf(it,c){const ok=/^t/i.test(it.a),o=el('div','tfb');['True','False'].forEach(x=>o.append(el('div','opt',x)));
const k=make(it,c,o,()=>{const s=el('span');s.append('Answer: ',el('span','tag '+(ok?'t':'f'),ok?'True':'False'));return s});
k._hint.textContent=k._hint0='Tap True or False to check · tap elsewhere to show the answer';
wire(it,[...o.children],k,ok?0:1,ok?'True':'False');return k}
function plain(it,c){return make(it,c,null,()=>el('span',null,'✔ '+it.a))}
function match(gr,c){const k=el('div','card static');k.style.setProperty('--c',c);k.append(el('div','q','Match each item with the correct description. Tap an item to see its answer.'));
const lg=el('div','legend');gr.items.forEach(m=>lg.append(el('span',null,m.key+') '+m.desc)));k.append(lg);
gr.items.forEach(m=>{const r=el('div','mrow');r.append(el('b',null,m.n+'. '+m.item));const d=gr.items.find(x=>x.key===m.ans);toggler(r,m.n,()=>el('span',null,'→ '+m.ans+') '+d.desc));k.append(r)});return k}
function render(){sets=[];const T=D[t],c=COL[t%4];
$('tabs').replaceChildren(...D.map((x,i)=>{const b=el('button','tab'+(i===t?' on':''),x.code);b.style.setProperty('--c',COL[i%4]);b.onclick=()=>{t=i;g=0;render()};return b}));
$('ttl').textContent=T.code+': '+T.title;
$('chips').replaceChildren(...T.groups.map((x,i)=>{const b=el('button','chip'+(i===g?' on':''),LBL[x.type]);b.style.setProperty('--c',c);b.append(el('em'));b.onclick=()=>{g=i;render()};return b}));
const gr=T.groups[g],ty=gr.type,box=$('list');box.replaceChildren();
if(ty==='match')box.append(match(gr,c));
else gr.items.forEach((it,i)=>{const k=ty==='mcq'?mcq(it,c):ty==='tf'?tf(it,c):ty==='open'||ty==='diagram'?make(it,c,null,()=>el('span',null,'💡 '+it.a)):plain(it,c);k.style.animationDelay=Math.min(i,8)*.04+'s';box.append(k)});
const nx=T.groups[g+1],f=el('div','foot');
if(nx){const b=el('button','btn','Next: '+LBL[nx.type]+' ➜');b.style.setProperty('--c',c);b.onclick=()=>{g++;render();scrollTo({top:0,behavior:'smooth'})};f.append(b)}
else if(D[t+1]){const b=el('button','btn','Next section: '+D[t+1].code+' ➜');b.style.setProperty('--c',COL[(t+1)%4]);b.onclick=()=>{t++;g=0;render();scrollTo({top:0,behavior:'smooth'})};f.append(b)}
box.append(f);stats()}
$('showAll').onclick=()=>sets.forEach(s=>s(true));$('hideAll').onclick=()=>sets.forEach(s=>s(false));
render();
</script>
